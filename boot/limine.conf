# ZillaOS UEFI boot: real firmware video modes are selected BEFORE the kernel.
# Limine uses a firmware-supported fallback if the selected mode is unavailable.
# During runtime the early kernel has no VMware SVGA mode-setting driver.
timeout: 5
default_entry: 1
verbose: yes

/ZillaOS
    protocol: limine
    path: boot():/boot/zillaos-kernel

/ZillaOS 800x600
    protocol: limine
    path: boot():/boot/zillaos-kernel
    resolution: 800x600x32

/ZillaOS 1024x768
    protocol: limine
    path: boot():/boot/zillaos-kernel
    resolution: 1024x768x32

/ZillaOS 1280x800
    protocol: limine
    path: boot():/boot/zillaos-kernel
    resolution: 1280x800x32
