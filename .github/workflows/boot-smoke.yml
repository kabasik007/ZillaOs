name: ZillaOS boot, CPU faults and desktop GUI

# Manual only: avoid consuming GitHub Actions minutes without approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install emulator and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso mtools

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-none
          rustup show active-toolchain
          rustc --version
          cargo --version
          qemu-system-x86_64 --version
          xorriso -version | head -n 2

      - name: Validate VM helper syntax and host-side tests
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          mkdir -p build/logs
          python3 scripts/installer_lab.py > build/logs/installer-lab-dry-run.json
          python3 -c "import json; d=json.load(open('build/logs/installer-lab-dry-run.json')); assert d['mode']=='DRY_RUN' and not d['plan']['installation_enabled'] and not d['plan']['bootable']"
          bash -n scripts/build.sh
          bash -n scripts/test_uefi_disk_qemu.sh
          bash -n scripts/export_vmware_test.sh
          bash -n scripts/installer_acceptance.sh
          bash -n scripts/verify_esp_mtools.sh
          # PowerShell is not installed in every Linux runner image.
          # When present, verify parse syntax without running Windows actions.
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$tokens = $null; $parseErrors = $null; $ast = [System.Management.Automation.Language.Parser]::ParseFile("scripts/vmware_installed.ps1", [ref]$tokens, [ref]$parseErrors); if ($parseErrors.Count -gt 0) { $parseErrors | Out-Host; exit 1 }'
          fi

      - name: Test pure Rust memory algorithms on host
        run: cargo test --lib --target x86_64-unknown-linux-gnu --offline

      - name: Build UEFI ISO
        run: bash scripts/build.sh test

      - name: Negative smoke (missing image must fail)
        run: |
          if python3 scripts/smoke_test.py --iso dist/nonexistent.iso; then
            echo "ERROR: missing image incorrectly passed"
            exit 1
          fi

      - name: Boot in QEMU + OVMF and capture serial evidence
        run: |
          set -o pipefail
          mkdir -p build/logs
          python3 scripts/smoke_test.py --timeout 90 2>&1 | tee build/logs/qemu-smoke.log

      - name: Build and test deliberate UD2 exception image
        run: |
          set -o pipefail
          bash scripts/build.sh fault
          python3 scripts/smoke_test.py --expect-fault --timeout 90 2>&1 | tee build/logs/qemu-fault.log

      - name: Build and smoke-test graphical Zilla Desktop
        run: |
          bash scripts/build.sh demo
          python3 scripts/desktop_smoke.py --timeout 90

      - name: Test nondefault first-run locale and device name
        run: |
          python3 scripts/desktop_smoke.py --setup-profile custom --timeout 90 --output build/logs/desktop-qemu-custom.ppm

      - name: Stage new GPT FAT32 UEFI disk and verify no-ISO boot
        run: |
          set -o pipefail
          python3 scripts/check_boot_assets.py | tee build/logs/boot-assets-preflight.json
          python3 scripts/installer_lab.py --name zillaos-ci-uefi.img --size-gib 12 --stage-uefi --create --confirm CREATE-NEW-VM-IMAGE | tee build/logs/installer-uefi-stage.json
          python3 scripts/installer_fat32_verify.py "$HOME/.local/share/zillaos/installer-lab/zillaos-ci-uefi.img" --check-boot
          bash scripts/verify_esp_mtools.sh zillaos-ci-uefi.img | tee build/logs/installer-uefi-mtools.log
          set +e
          timeout 90s bash scripts/test_uefi_disk_qemu.sh zillaos-ci-uefi.img --headless > build/logs/installer-uefi-qemu-run.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "Unexpected QEMU exit: $rc"
            cat build/logs/installer-uefi-qemu-run.log
            exit 1
          fi
          test -s build/logs/installer-uefi-disk-serial.log
          python3 scripts/boot_evidence.py build/logs/installer-uefi-disk-serial.log > build/logs/installer-uefi-boot-evidence.json
          grep -qx 'ZILLAOS_SETUP_READY' build/logs/installer-uefi-disk-serial.log
          echo "PASS: kernel booted from staged GPT+FAT32 disk without ISO"

      # Formatting is a strict final gate, but must not prevent collection
      # of useful compiler, QEMU boot and GUI diagnostics beforehand.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Save image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-x86-64-kernel-desktop-evidence
          path: |
            dist/*.iso
            dist/*.elf
            target/x86_64-unknown-none/release/zillaos-kernel
            build/logs/qemu-smoke.log
            build/logs/qemu-fault.log
            build/logs/desktop-qemu.log
            build/logs/desktop-qemu.ppm
            build/logs/desktop-qemu-cursor.ppm
            build/logs/desktop-qemu-setup.ppm
            build/logs/desktop-qemu-storage.ppm
            build/logs/installer-lab-dry-run.json
            build/logs/boot-assets-preflight.json
            build/logs/installer-uefi-stage.json
            build/logs/installer-uefi-mtools.log
            build/logs/installer-uefi-qemu-run.log
            build/logs/installer-uefi-disk-serial.log
            build/logs/installer-uefi-boot-evidence.json
            build/logs/desktop-qemu-install-plan.ppm
            build/logs/desktop-qemu-custom-install-plan.ppm
            build/logs/desktop-qemu-custom-storage.ppm
            build/logs/desktop-qemu-custom*.ppm
          if-no-files-found: warn
          retention-days: 7
