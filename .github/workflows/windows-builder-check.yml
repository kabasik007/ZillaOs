name: Windows Builder regression checks

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'scripts/windows.ps1'
      - 'scripts/vmware.ps1'
      - 'scripts/windows_line_endings.ps1'
      - 'scripts/windows_wsl_entry.sh'
      - 'tests/test_windows_line_endings.ps1'
      - 'tests/test_windows_entrypoint.py'
      - 'tests/test_windows_wsl_entry.py'
      - 'tests/test_vmware_profile.py'
      - 'scripts/windows_wsl_setup.sh'
      - 'scripts/build_vmware.sh'
      - 'src/**'
      - 'boot/limine.conf'
      - 'scripts/boot_assets_audit.py'
      - 'scripts/installer_lab.py'
      - 'tests/test_boot_assets_audit.py'
      - '.github/workflows/windows-builder-check.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'scripts/windows.ps1'
      - 'scripts/windows_wsl_entry.sh'
      - 'scripts/windows_line_endings.ps1'
      - 'tests/test_windows_line_endings.ps1'
      - 'scripts/vmware.ps1'
      - 'tests/test_windows_entrypoint.py'
      - 'tests/test_windows_wsl_entry.py'
      - 'tests/test_vmware_profile.py'
      - 'src/**'
      - 'boot/limine.conf'
      - 'scripts/boot_assets_audit.py'
      - 'scripts/installer_lab.py'
      - 'tests/test_boot_assets_audit.py'
      - '.github/workflows/windows-builder-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entrypoint-and-staging-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate WSL shell entrypoint syntax
        run: bash -n scripts/windows_wsl_entry.sh
      - name: Compile Python tools before running tests
        run: python3 -m compileall -q scripts tests
      - name: Execute complete host Python suite (including VMware profile)
        run: python3 -m unittest discover -s tests -v

  windows-powershell-parser:
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 scripts without execution
        run: |
          $files = @('scripts/windows.ps1', 'scripts/vmware.ps1', 'scripts/windows_line_endings.ps1', 'tests/test_windows_line_endings.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List * | Out-Host
              throw ("PowerShell syntax failed: " + $file)
            }
            Write-Host ("Parsed: " + $file)
          }
      - name: Execute CRLF regression in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_line_endings.ps1

  rust-host-link-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Provide host C compiler and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential lld xorriso
      - name: Install pinned Rust version and bare-metal target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Diagnose real linker availability
        run: bash scripts/windows_wsl_setup.sh --check
      - name: Link and execute Rust library tests on host
        run: cargo test --lib --target x86_64-unknown-linux-gnu --offline
      - name: Compile shared-parser PE inspector on Linux host
        run: cargo build --bin pe-inspect --features pe-inspector-cli --target x86_64-unknown-linux-gnu --offline
      - name: PE inspector rejects malformed EXE without executing it
        run: |
          printf 'MZnot_a_real_executable' > invalid.exe
          if target/x86_64-unknown-linux-gnu/debug/pe-inspect invalid.exe; then
            echo 'Malformed PE was incorrectly accepted' >&2
            exit 1
          fi
      - name: Compile bare-metal GUI kernel (Limine demo)
        run: cargo build --release --target x86_64-unknown-none --offline --features vm-demo
