name: ZillaOS process foundation checks

on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/process/**'
      - 'src/kernel/page_table_walk.rs'
      - 'src/page_table_observer.rs'
      - 'src/native_vm_staging.rs'
      - 'src/native_ring3.rs'
      - 'src/native_ring3_threads.rs'
      - 'src/native_ring3_preempt.rs'
      - 'src/main.rs'
      - 'Cargo.toml'
      - 'scripts/build.sh'
      - 'docs/PAGING_AUDIT.md'
      - 'scripts/smoke_test.py'
      - 'src/services/process_manager.rs'
      - 'src/services/mod.rs'
      - 'src/lib.rs'
      - 'docs/PROCESSES.md'
      - '.github/workflows/process-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-host-and-baremetal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
          rustc +1.90.0 --version
      - name: Host process and memory regression tests
        run: cargo +1.90.0 test --lib --target x86_64-unknown-linux-gnu --offline
      - name: Compile kernel without GUI
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline
      - name: Compile kernel with existing GUI
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features vm-demo

      - name: Compile read-only paging observer
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features paging-audit
      - name: Compile native Ring3 fixture before QEMU
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features native-ring3
      - name: Compile user guard-fault regression fixture
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features native-ring3-guard-fault
      - name: Compile supervisor boundary fault fixture
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features native-ring3-kernel-fault
      - name: Compile cooperative two-thread Ring3 fixture
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features native-ring3-threads
      - name: Compile timer-preemption Ring3 experiment
        run: cargo +1.90.0 build --release --target x86_64-unknown-none --offline --features native-ring3-preempt

  paging-audit-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install Rust 1.90 target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build opt-in audit ISO
        run: bash scripts/build.sh audit
      - name: Boot audit image and require observer evidence
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-audit-uefi.iso --timeout 90 | tee audit-qemu.log
          grep -qx 'ZILLAOS_PAGING_AUDIT_OK' audit-qemu.log
          grep -q '^ZILLAOS_PAGING_AUDIT_CR3=0x' audit-qemu.log
          if grep -q 'ZILLAOS_PAGING_AUDIT_FAILED' audit-qemu.log; then exit 1; fi
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-paging-audit-evidence
          path: |
            audit-qemu.log
            dist/*audit*.iso
          if-no-files-found: warn

  native-vm-staging-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install Rust 1.90 target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build staging ISO
        run: bash scripts/build.sh stage
      - name: Verify staging page tables in QEMU
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-stage-uefi.iso --timeout 90 | tee stage-qemu.log
          grep -qx 'ZILLAOS_NATIVE_VM_STAGE_OK' stage-qemu.log
          grep -q '^ZILLAOS_NATIVE_VM_STAGED_CR3=0x' stage-qemu.log
          if grep -q 'ZILLAOS_NATIVE_VM_STAGE_FAILED' stage-qemu.log; then exit 1; fi
      - name: Save staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-native-vm-staging-evidence
          path: |
            stage-qemu.log
            dist/*stage*.iso
          if-no-files-found: warn

  native-ring3-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install Rust 1.90 target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build isolated native Ring3 fixture ISO
        run: bash scripts/build.sh ring3
      - name: Require real CPL3 syscall and clean exit in QEMU
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-ring3-uefi.iso --timeout 90 | tee ring3-qemu.log
          grep -qx 'ZILLAOS_NATIVE_RING3_ENTER' ring3-qemu.log
          grep -qx 'ZILLAOS_NATIVE_STDOUT=Hello from ZillaOS Native Ring3!' ring3-qemu.log
          grep -qx 'ZILLAOS_NATIVE_EXIT_CODE=0x0000000000000000' ring3-qemu.log
          grep -qx 'ZILLAOS_NATIVE_RING3_RETURNED' ring3-qemu.log
          grep -qx 'ZILLAOS_NATIVE_RING3_OK' ring3-qemu.log
          if grep -q 'ZILLAOS_NATIVE_RING3_FAILED' ring3-qemu.log; then exit 1; fi
      - name: Save isolated native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-ring3-native-hello-evidence
          path: |
            ring3-qemu.log
            dist/*ring3*.iso
          if-no-files-found: warn

  native-ring3-guard-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install Rust 1.90 target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build negative user guard-page ISO
        run: bash scripts/build.sh ring3-guard
      - name: User page fault must be contained and return to kernel
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-ring3-guard-uefi.iso --timeout 90 | tee ring3-guard.log
          grep -qx 'ZILLAOS_NATIVE_RING3_ENTER' ring3-guard.log
          grep -qx 'ZILLAOS_NATIVE_STDOUT=Hello from ZillaOS Native Ring3!' ring3-guard.log
          grep -qx 'ZILLAOS_NATIVE_USER_FAULT_VECTOR=0x000000000000000e' ring3-guard.log
          grep -qx 'ZILLAOS_NATIVE_USER_GUARD_FAULT_OK' ring3-guard.log
          grep -qx 'ZILLAOS_NATIVE_RING3_RETURNED' ring3-guard.log
          grep -qx 'ZILLAOS_NATIVE_RING3_OK' ring3-guard.log
          if grep -q 'ZILLAOS_EXCEPTION_FATAL\|ZILLAOS_NATIVE_RING3_FAILED\|ZILLAOS_PANIC' ring3-guard.log; then exit 1; fi
      - name: Save guard-fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-ring3-guard-fault-evidence
          path: |
            ring3-guard.log
            dist/*ring3-guard*.iso
          if-no-files-found: warn

  native-ring3-kernel-boundary-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install Rust 1.90 target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build supervisor boundary ISO
        run: bash scripts/build.sh ring3-kernel
      - name: Verify CPL3 cannot read mapped kernel code
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-ring3-kernel-uefi.iso --timeout 90 | tee ring3-kernel.log
          grep -qx 'ZILLAOS_NATIVE_STDOUT=Hello from ZillaOS Native Ring3!' ring3-kernel.log
          grep -qx 'ZILLAOS_NATIVE_USER_FAULT_VECTOR=0x000000000000000e' ring3-kernel.log
          grep -qx 'ZILLAOS_NATIVE_USER_KERNEL_ACCESS_DENIED' ring3-kernel.log
          grep -qx 'ZILLAOS_NATIVE_RING3_RETURNED' ring3-kernel.log
          grep -qx 'ZILLAOS_NATIVE_RING3_OK' ring3-kernel.log
          grep -qx 'ZILLAOS_BOOT_OK' ring3-kernel.log
          if grep -q 'ZILLAOS_EXCEPTION_FATAL\|ZILLAOS_NATIVE_RING3_FAILED\|ZILLAOS_PANIC' ring3-kernel.log; then exit 1; fi
      - name: Save kernel-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-ring3-supervisor-protection-evidence
          path: |
            ring3-kernel.log
            dist/*ring3-kernel*.iso
          if-no-files-found: warn

  native-ring3-cooperative-threads-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install pinned Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build isolated native two-thread Ring3 ISO
        run: bash scripts/build.sh ring3-threads
      - name: Verify six real CPL3 yields and both exits
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-ring3-threads-uefi.iso --timeout 90 | tee ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_THREADS_ENTER' ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_THREADS_RETURNED' ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_THREAD_TRACE=ABABAB' ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_THREAD_A_EXIT' ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_THREAD_B_EXIT' ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_THREADS_BOTH_EXITED' ring3-threads.log
          grep -qx 'ZILLAOS_NATIVE_RING3_OK' ring3-threads.log
          grep -qx 'ZILLAOS_BOOT_OK' ring3-threads.log
          if grep -q 'ZILLAOS_NATIVE_RING3_FAILED\|ZILLAOS_EXCEPTION_FATAL\|ZILLAOS_PANIC' ring3-threads.log; then exit 1; fi
      - name: Save Ring3 cooperative execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-ring3-two-threads-evidence
          path: |
            ring3-threads.log
            dist/*ring3-threads*.iso
          if-no-files-found: warn

  native-ring3-pit-preemption-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install Rust 1.90 target
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Build isolated PIT preemption ISO
        run: bash scripts/build.sh ring3-preempt
      - name: Require IRQ0 switching with no voluntary yield
        run: |
          set -o pipefail
          python3 scripts/smoke_test.py --iso dist/zillaos-0.0.2-dev-ring3-preempt-uefi.iso --timeout 45 | tee pit-preempt.log
          grep -qx 'ZILLAOS_TIMER_PREEMPT_ENTER' pit-preempt.log
          grep -qx 'ZILLAOS_TIMER_PREEMPT_RETURNED' pit-preempt.log
          grep -qx 'ZILLAOS_TIMER_PREEMPT_TRACE=ABABABAB' pit-preempt.log
          grep -qx 'ZILLAOS_TIMER_PREEMPT_TICKS=0x0000000000000008' pit-preempt.log
          grep -qx 'ZILLAOS_TIMER_PREEMPT_BOTH_PROGRESS' pit-preempt.log
          grep -qx 'ZILLAOS_TIMER_PREEMPT_OK' pit-preempt.log
          grep -qx 'ZILLAOS_NATIVE_RING3_OK' pit-preempt.log
          grep -qx 'ZILLAOS_BOOT_OK' pit-preempt.log
          if grep -Eq 'ZILLAOS_TIMER_PREEMPT_VERIFICATION_FAILED|ZILLAOS_NATIVE_RING3_FAILED|ZILLAOS_EXCEPTION_FATAL|ZILLAOS_PANIC' pit-preempt.log; then exit 1; fi
      - name: Save timer preemption artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-pit-preempt-evidence
          path: |
            pit-preempt.log
            dist/*ring3-preempt*.iso
          if-no-files-found: warn
