name: ZillaOS framebuffer and desktop regression

on:
  push:
    branches: [main]
    paths:
      - 'src/ui/raster.rs'
      - 'src/graphics.rs'
      - 'src/main.rs'
      - 'src/shell/**'
      - 'src/apps/**'
      - 'src/fs/mod.rs'
      - 'src/drivers/rtc.rs'
      - 'docs/TASK_MANAGER.md'
      - 'docs/GRAPHICS.md'
      - '.github/workflows/graphics-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-buffered-desktop-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU/OVMF and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Test software framebuffer bounds and kernel algorithms
        run: cargo +1.90.0 test --lib --target x86_64-unknown-linux-gnu --offline
      - name: Build graphical UEFI ISO
        run: bash scripts/build.sh demo
      - name: Verify graphical desktop boot, screenshots, keyboard and cursor
        run: |
          set -o pipefail
          python3 scripts/desktop_smoke.py --iso dist/zillaos-0.0.2-dev-demo-uefi.iso --timeout 120 | tee desktop-regression.log
          python3 - <<'PY'
          from pathlib import Path
          lines = [line.strip() for line in Path("build/logs/desktop-qemu.log").read_text(errors="replace").splitlines()]
          required = (
              "ZILLAOS_SETUP_GRAPHICS_BUFFERED_READY",
              "ZILLAOS_GRAPHICS_BUFFERED_READY",
              "ZILLAOS_DESKTOP_READY",
          )
          for marker in required:
              count = lines.count(marker)
              print(f"framebuffer marker {marker}: count={count}")
              if count != 1:
                  print("framebuffer diagnostics:", [line for line in lines if "ZILLAOS_" in line and ("GRAPHICS" in line or "FRAMEBUFFER" in line)][-40:])
                  raise SystemExit(1)
          if not any(line.startswith("ZILLAOS_FRAMEBUFFER_WIDTH=0x") for line in lines):
              print("Missing framebuffer width diagnostic")
              raise SystemExit(1)
          if "ZILLAOS_SETUP_GRAPHICS_DIRECT_FALLBACK" in lines:
              raise SystemExit("Unsupported direct framebuffer fallback")
          PY
      - name: Archive GUI screenshot and serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-framebuffer-desktop-regression
          path: |
            desktop-regression.log
            build/logs/desktop-qemu*.log
            build/logs/desktop-qemu*.ppm
            dist/*demo*.iso
          if-no-files-found: warn
