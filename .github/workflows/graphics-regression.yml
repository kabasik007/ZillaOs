name: ZillaOS framebuffer and desktop regression

on:
  push:
    branches: [main]
    paths:
      - 'src/ui/raster.rs'
      - 'src/graphics.rs'
      - 'src/main.rs'
      - 'src/shell/**'
      - 'src/apps/**'
      - 'src/fs/mod.rs'
      - 'src/drivers/rtc.rs'
      - 'docs/TASK_MANAGER.md'
      - 'docs/GRAPHICS.md'
      - '.github/workflows/graphics-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-buffered-desktop-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU/OVMF and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
      - name: Test software framebuffer bounds and kernel algorithms
        run: cargo +1.90.0 test --lib --target x86_64-unknown-linux-gnu --offline
      - name: Build graphical UEFI ISO
        run: bash scripts/build.sh demo
      - name: Verify graphical desktop boot, screenshots, keyboard and cursor
        run: |
          set -o pipefail
          python3 scripts/desktop_smoke.py --iso dist/zillaos-0.0.2-dev-demo-uefi.iso --timeout 120 | tee desktop-regression.log
          python3 - <<'PY'
          from pathlib import Path
          lines = [line.strip() for line in Path("build/logs/desktop-qemu.log").read_text(errors="replace").splitlines()]
          required = (
              "ZILLAOS_SETUP_GRAPHICS_BUFFERED_READY",
              "ZILLAOS_GRAPHICS_BUFFERED_READY",
              "ZILLAOS_DESKTOP_READY",
          )
          for marker in required:
              count = lines.count(marker)
              print(f"framebuffer marker {marker}: count={count}")
              if count != 1:
                  print("framebuffer diagnostics:", [line for line in lines if "ZILLAOS_" in line and ("GRAPHICS" in line or "FRAMEBUFFER" in line)][-40:])
                  raise SystemExit(1)
          if not any(line.startswith("ZILLAOS_FRAMEBUFFER_WIDTH=0x") for line in lines):
              print("Missing framebuffer width diagnostic")
              raise SystemExit(1)
          if "ZILLAOS_SETUP_GRAPHICS_DIRECT_FALLBACK" in lines:
              raise SystemExit("Unsupported direct framebuffer fallback")
          PY
      - name: Build optional ISO with a synthetic BMP wallpaper
        run: |
          mkdir -p assets
          python3 - <<'PY'
          from pathlib import Path
          import struct
          w = h = 8
          stride = (w * 3 + 3) & ~3
          size = 54 + stride * h
          data = bytearray(size)
          data[:2] = b"BM"
          struct.pack_into("<I", data, 2, size)
          struct.pack_into("<I", data, 10, 54)
          struct.pack_into("<I", data, 14, 40)
          struct.pack_into("<ii", data, 18, w, h)
          struct.pack_into("<HH", data, 26, 1, 24)
          data[54:] = bytes([255, 0, 255]) * (w * h)
          Path("assets/wallpaper.bmp").write_bytes(data)
          PY
          python3 scripts/wallpaper_asset.py validate assets/wallpaper.bmp
          bash scripts/build.sh demo
          python3 - <<'PY'
          from pathlib import Path
          config = Path("build/iso-root/limine.conf").read_text()
          assert config.count("module_path: boot():/boot/wallpaper.bmp") == 6
          assert config.count("module_string: zillaos-wallpaper") == 6
          assert Path("build/iso-root/boot/wallpaper.bmp").exists()
          PY
      - name: Prove custom wallpaper actually reaches GOP pixels in QEMU
        run: |
          set -o pipefail
          python3 scripts/desktop_smoke.py \
            --iso dist/zillaos-0.0.2-dev-demo-uefi.iso \
            --output build/logs/desktop-custom-wallpaper.ppm \
            --timeout 120 | tee wallpaper-regression.log
          python3 - <<'PY'
          from pathlib import Path
          log = Path("build/logs/desktop-custom-wallpaper.log").read_text(errors="replace")
          if log.count("ZILLAOS_WALLPAPER_MODULE=READY") != 1:
              raise SystemExit("No validated Limine BMP module reached the desktop")
          path = Path("build/logs/desktop-custom-wallpaper.ppm")
          with path.open("rb") as stream:
              magic = stream.readline().strip()
              dims = stream.readline().strip()
              maximum = stream.readline().strip()
              data = stream.read()
          assert magic == b"P6" and maximum == b"255"
          width, height = map(int, dims.split())
          assert (width, height) == (1280, 800)
          assert len(data) == width * height * 3
          # Windows and folder icons may cover any particular coordinate.
          # Assert a sizable visible area of the test-only magenta bitmap.
          magenta = bytes([255, 0, 255])
          count = sum(data[i:i + 3] == magenta for i in range(0, len(data), 3))
          if count < 1000:
              raise SystemExit(f"Custom BMP not visible as wallpaper: {count} magenta pixels")
          print(f"PASS: custom Limine BMP rendered through GOP ({count} magenta pixels)")
          PY
      - name: Archive GUI screenshot and serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zillaos-framebuffer-desktop-regression
          path: |
            desktop-regression.log
            wallpaper-regression.log
            build/logs/desktop-custom-wallpaper*.ppm
            build/logs/desktop-qemu*.log
            build/logs/desktop-qemu*.ppm
            dist/*demo*.iso
          if-no-files-found: warn
