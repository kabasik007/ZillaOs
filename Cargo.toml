[package]
name = "zillaos-kernel"
version = "0.0.1"
edition = "2024"
authors = ["ZillaOS contributors"]
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true

[features]
# The demo image stays on screen; the test image exits QEMU deterministically.
vm-demo = []

# Build the negative QEMU image which deliberately traps on UD2.
exception-self-test = []
