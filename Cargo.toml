[package]
name = "zillaos-kernel"
version = "0.0.2-dev"
edition = "2024"
authors = ["ZillaOS contributors"]
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true

[features]
# The demo image stays on screen; the test image exits QEMU deterministically.
vm-demo = []

# Build the negative QEMU image which deliberately traps on UD2.
exception-self-test = []

# Explicit opt-in: read-only CR3 observation and verified page-table walk.
paging-audit = []

# Experimental owned page-table construction, no CR3 switch or Ring 3 entry.
vm-staging = ["paging-audit"]

# Disposable QEMU-only, single native Ring 3 fixture with INT 0x80 write/exit.
# No ELF/PE input, no desktop execution, no public process runtime.
native-ring3 = ["vm-staging"]

# Negative QEMU fixture: user read of unmapped stack guard must fault safely.
native-ring3-guard-fault = ["native-ring3"]

# Negative QEMU fixture: user read of present supervisor kernel text must fault.
native-ring3-kernel-fault = ["native-ring3"]

# Disposable one-process/two-user-thread cooperative IRETQ switch fixture.
# Never enabled for the Desktop or the other Ring3 regression ISOs.
native-ring3-threads = ["native-ring3"]

# Explicit opt-in: host-only PE inspector, never bundled into bare-metal ISO.
pe-inspector-cli = []

# Optional VMware SVGA ID negotiation. Off for the normal desktop ISO.
svga-id-negotiate = []

[[bin]]
name = "pe-inspect"
path = "src/bin/pe_inspect.rs"
required-features = ["pe-inspector-cli"]
